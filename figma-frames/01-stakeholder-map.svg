<text x="644.4" y="398.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">IT / ERP team</text>
<text x="644.4" y="415.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">System owner</text>
</g>
