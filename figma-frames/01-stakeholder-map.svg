<text x="96" y="490.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430" text-anchor="middle" transform="rotate(-90 96 490.0)">Power</text>
<text x="530.0" y="846" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430" text-anchor="middle">Interest in the change</text>
