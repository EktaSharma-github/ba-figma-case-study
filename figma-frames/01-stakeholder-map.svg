<text x="316.4" y="300.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">Compliance</text>
</g>
<g id="Stakeholder / Tax team">
<circle cx="366.0" cy="413.2" r="9" fill="#A86A00"/>
<text x="382.0" y="411.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">Tax team</text>
<text x="382.0" y="428.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">GST recovery</text>
</g>
<g id="Stakeholder / Line managers">
<circle cx="710.4" cy="579.6" r="9" fill="#0F7B6C"/>
<text x="726.4" y="577.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">Line managers</text>
<text x="726.4" y="594.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">Approvers</text>
</g>
<g id="Stakeholder / Field staff">
<circle cx="743.2" cy="682.0" r="9" fill="#0F7B6C"/>
<text x="759.2" y="680.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">Field staff</text>
<text x="759.2" y="697.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">120 claimants/mo</text>
</g>
<g id="Stakeholder / Travel desk">
<circle cx="333.20000000000005" cy="682.0" r="9" fill="#5B6676"/>
<text x="349.20000000000005" y="680.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">Travel desk</text>
<text x="349.20000000000005" y="697.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">Bookings</text>
</g>
<rect x="1000" y="170" width="392" height="640" rx="8" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<text x="1024" y="206" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2430" text-anchor="start">What we heard</text>
<rect x="1024" y="236" width="3" height="58" rx="0" fill="#1F5FAD"/>
<text x="1040" y="250.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">“We key every receipt twice: once in</text>
<text x="1040" y="267.55" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">the spreadsheet, once in the ERP.”</text>
<text x="1040" y="292" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5B6676" text-anchor="start">AP Lead</text>
<rect x="1024" y="336" width="3" height="58" rx="0" fill="#1F5FAD"/>
<text x="1040" y="350.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">“I wait three weeks to get my own</text>
<text x="1040" y="367.55" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">money back.”</text>
<text x="1040" y="392" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5B6676" text-anchor="start">Field staff</text>
<rect x="1024" y="436" width="3" height="58" rx="0" fill="#1F5FAD"/>
<text x="1040" y="450.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">“Approvals arrive as email attachments.</text>
<text x="1040" y="467.55" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">I can&#x27;t see the policy limits.”</text>
<text x="1040" y="492" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5B6676" text-anchor="start">Line manager</text>
<rect x="1024" y="536" width="3" height="58" rx="0" fill="#1F5FAD"/>
<text x="1040" y="550.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">“18% of claims last year were missing</text>
<text x="1040" y="567.55" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#1B2430" text-anchor="start">an itemised receipt.”</text>
<text x="1040" y="592" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5B6676" text-anchor="start">Internal Audit</text>
<line x1="1024" y1="640" x2="1368" y2="640" stroke="#C9D1DB" stroke-width="1"/>
<text x="1024" y="670" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2430" text-anchor="start">RACI owner for sign-off: CFO</text>
<text x="1024" y="692" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6676" text-anchor="start">Process owner: AP Lead</text>
</svg>