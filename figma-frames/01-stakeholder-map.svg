<rect x="530.0" y="490.0" width="410.0" height="320.0" rx="0" fill="#DDF2EE" stroke="#C9D1DB" stroke-width="1"/>
<text x="546.0" y="518.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6676" text-anchor="start" letter-spacing="1">KEEP INFORMED</text>
