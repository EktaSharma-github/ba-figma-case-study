<text x="775.6" y="347.20000000000005" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1B2430" text-anchor="start">AP Lead</text>
<text x="775.6" y="364.20000000000005" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="start">Process owner</text>
</g>
