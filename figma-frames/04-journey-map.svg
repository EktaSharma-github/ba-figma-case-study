<line x1="1540" y1="246" x2="1540" y2="342" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="3 4"/>
<text x="244" y="272" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Pays hotel and taxi</text>
<text x="244" y="291" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">on personal card</text>
<text x="574" y="272" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Stuffs receipts</text>
<text x="574" y="291" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">into wallet</text>
<text x="904" y="272" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Types 22 rows into</text>
<text x="904" y="291" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Excel on a Sunday</text>
<text x="1234" y="272" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Waits; chases</text>
<text x="1234" y="291" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">manager on chat</text>
<text x="1564" y="272" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">Checks bank</text>
<text x="1564" y="291" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">account daily</text>
<rect x="48" y="366" width="1824" height="100" rx="6" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<text x="64" y="394" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#5B6676" text-anchor="start" letter-spacing="1">THINKING</text>
<line x1="550" y1="378" x2="550" y2="454" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="880" y1="378" x2="880" y2="454" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="1210" y1="378" x2="1210" y2="454" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="1540" y1="378" x2="1540" y2="454" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="3 4"/>
<text x="244" y="404" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">“Will this be</text>
<text x="244" y="423" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">within policy?”</text>
<text x="574" y="404" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">“Did I lose the</text>
<text x="574" y="423" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">taxi receipt?”</text>
<text x="904" y="404" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">“What&#x27;s the GL</text>
<text x="904" y="423" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">code for tolls?”</text>
<text x="1234" y="404" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">“Has anyone</text>
<text x="1234" y="423" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">even opened it?”</text>
<text x="1564" y="404" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">“Why is it short</text>
<text x="1564" y="423" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2430" text-anchor="start">by ₹640?”</text>
