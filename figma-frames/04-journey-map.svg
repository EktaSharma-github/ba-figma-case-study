<text x="48" y="58" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F5FAD" text-anchor="start" letter-spacing="1.2">04 · PERSONA JOURNEY</text>
<text x="48" y="92" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430" text-anchor="start">Journey map: Priya, regional sales executive</text>
<text x="48" y="120" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6676" text-anchor="start">Travels 9 days a month · submits ~22 receipts · smartphone-first</text>
<text x="1872" y="58" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6676" text-anchor="end">Halden Logistics · Expense Reimbursement Redesign</text>
<rect x="48" y="170" width="1824" height="52" rx="6" fill="#1B2430"/>
<text x="385.0" y="202" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">1. Spend</text>
<text x="715.0" y="202" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">2. Collect receipts</text>
<text x="1045.0" y="202" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">3. Prepare claim</text>
<text x="1375.0" y="202" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">4. Approval</text>
<text x="1705.0" y="202" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">5. Payment</text>
